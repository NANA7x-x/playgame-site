<style>

/*
VOICE: ゲーセンの筐体みたいに賑やかだけど、情報は読みやすく
IDEA: 電源を入れるとタイトル画面→メニューに入るアーケード筐体
PICTURE: PRESS START のタイトル画面と、ネオンのPGロゴ
COLOUR and TYPE: 夜の紫 #0b0814 / ネオンピンク #ff3fd0 / シアン #2fd8ff、見出しは DotGothic16、本文は M PLUS 1p
LAYOUT: 入口 → 固定メニュー → 紹介・大会・実績・お知らせ・リンクを縦に
*/
:root{color-scheme:dark;--bg:#0b0814;--panel:#171126;--panel2:#1f1733;--ink:#f3efff;--muted:#b9add9;--pink:#ff3fd0;--cyan:#2fd8ff;--mint:#4fffc0;--violet:#7a5cff;--line:#3a2d57}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:calc(var(--hh,100px) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "M PLUS 1p","Noto Sans JP",system-ui,sans-serif;overflow-x:clip}
body.locked{overflow:hidden}
a{color:var(--cyan)}a:hover{color:#8fe9ff}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.px{font-family:"DotGothic16",monospace;letter-spacing:.04em}

/* welcome */
#welcome{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#2a165099,#0b0814 70%),linear-gradient(#a596ff18 2px,transparent 2px) 0 0/40px 40px,linear-gradient(90deg,#a596ff18 2px,transparent 2px) 0 0/40px 40px,#0b0814;cursor:pointer;display:grid;place-items:center;overflow:hidden;transition:opacity .6s ease}
#welcome .stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center;transition:transform .6s cubic-bezier(.5,0,.8,.4),filter .6s}
#welcome.out{opacity:0;pointer-events:none}
#welcome[hidden]{display:none}
#welcome.out .stage{filter:brightness(2.4) saturate(1.4)}
#welcome .hint{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:var(--muted);font-size:13px}
#welcome .skip{position:absolute;top:14px;right:14px;background:#0008;border:1px solid var(--line);color:var(--ink);font:13px "DotGothic16",monospace;padding:10px 14px;border-radius:8px;cursor:pointer}

/* site */
header.bar{position:fixed;top:0;left:0;right:0;z-index:40;background:#0b0814;border-bottom:2px solid var(--line);box-shadow:0 6px 0 #00000055}
.bar .in{max-width:1180px;margin:auto;display:flex;align-items:center;gap:16px;padding:10px max(4vw,14px);flex-wrap:wrap}
.bar .brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-size:18px}
.bar .brand img{height:38px;width:auto}
.bar nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.bar nav a{color:var(--ink);text-decoration:none;padding:9px 12px;border-radius:8px;border:2px solid transparent;font-size:15px}
.bar nav a:hover{border-color:var(--pink);background:#ff3fd014}.bar nav a[aria-current=page]{border-color:var(--cyan);background:#2fd8ff1f;color:#fff}
main{max-width:1180px;margin:auto;padding:0 max(4vw,14px)}
section.page{padding:clamp(28px,5vw,60px) 0 clamp(40px,6vw,80px)}section.page:not(.cur){display:none}
h2{font:400 clamp(28px,4vw,40px)/1.1 "DotGothic16",monospace;margin:0 0 6px;text-wrap:balance}
h2 .ic{display:inline-block;width:.9em;height:.9em;margin-right:.35em;vertical-align:-.05em;background:var(--c,var(--pink));box-shadow:4px 4px 0 #0008;clip-path:polygon(0 30%,30% 30%,30% 0,70% 0,70% 30%,100% 30%,100% 70%,70% 70%,70% 100%,30% 100%,30% 70%,0 70%)}
.lead{color:var(--muted);margin:0 0 28px;max-width:62ch}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,28px);box-shadow:6px 6px 0 #00000066}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:10px;border:2px solid var(--ink);background:var(--pink);color:#fff;text-decoration:none;font:16px "DotGothic16",monospace;box-shadow:4px 4px 0 #000;transition:transform .1s}
.btn:hover{transform:translate(-1px,-1px);color:#fff}
.btn.alt{background:var(--panel2);border-color:var(--cyan)}
.btn[aria-disabled=true]{background:#2a2238;border-color:var(--line);color:var(--muted);box-shadow:none;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center}
.logo{position:relative;display:grid;gap:10px;justify-items:center;padding:24px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#3a1a6b,#120b20 70%);border:2px solid var(--line)}
.logo img{width:100%;height:auto;display:block;filter:drop-shadow(0 0 18px #a24bea88)}
.logo .k{width:88%}.logo .e{width:70%}
.about p{margin:0 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.tags li{border:2px solid var(--c);color:var(--ink);padding:4px 12px;border-radius:999px;font-size:14px}

/* tournament */
.tour{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.tour .head{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.tour .name{font:400 clamp(30px,5vw,48px)/1.05 "DotGothic16",monospace;margin:0;background:linear-gradient(90deg,var(--pink),var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{font:14px "DotGothic16",monospace;padding:6px 12px;border-radius:8px;background:var(--mint);color:#0b0814;white-space:nowrap}
dl.spec{display:grid;grid-template-columns:7em minmax(0,1fr);gap:10px 14px;margin:0}
dl.spec dt{color:var(--muted);font-size:14px}
dl.spec dd{margin:0;font-weight:700}
ol.sched{list-style:none;margin:0;padding:0;display:grid;gap:14px}
ol.sched li{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:14px;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--line)}
ol.sched .d{font:20px "DotGothic16",monospace;color:var(--cyan);white-space:nowrap}
ol.rules{margin:0;padding-left:1.4em;display:grid;gap:8px}
h3{font:400 20px "DotGothic16",monospace;margin:0 0 14px;color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin-top:14px}

/* archive */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.res .vol{font:400 22px "DotGothic16",monospace;margin:0}
.res .date{color:var(--muted);font-size:14px}
.res ol{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.res li{display:flex;gap:10px;align-items:center}
.res .rk{font:16px "DotGothic16",monospace;width:3.2em;text-align:center;border-radius:6px;padding:2px 0;color:#0b0814;background:var(--c)}
.empty{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;font:400 22px "DotGothic16",monospace;color:var(--ink);margin-bottom:6px}

/* news */
ul.news{list-style:none;margin:0;padding:0;display:grid;gap:0}
ul.news li{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:16px 4px;border-bottom:1px solid var(--line)}
ul.news time{font:16px "DotGothic16",monospace;color:var(--pink);white-space:nowrap}
ul.news .tg{justify-self:start;font-size:12px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:999px;white-space:nowrap}

/* links */
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.lk{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);border-color:var(--c)}
.lk:hover{transform:translate(-2px,-2px);color:var(--ink)}
.lk .t{font:400 22px "DotGothic16",monospace}
.lk .s{color:var(--muted);font-size:14px}
.lk .go{margin-top:auto;padding-top:10px;font:14px "DotGothic16",monospace;color:var(--c)}
.lk.off{opacity:.6;pointer-events:none}

footer{max-width:1180px;margin:auto;padding:32px max(4vw,14px) 48px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

@media(max-width:760px){
 .about,.tour{grid-template-columns:minmax(0,1fr)}
 ul.news li{grid-template-columns:minmax(0,1fr)}
 ol.sched li{grid-template-columns:6em minmax(0,1fr)}
 .bar nav{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
 .bar nav a{flex:none}
}

.yh{margin:44px 0 6px;font-size:24px}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ev{display:flex;flex-direction:column;gap:6px;border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.ev .evh{display:flex;justify-content:space-between;align-items:center}
.ev .mo{font:400 15px "DotGothic16",monospace;color:var(--muted)}
.ev .dy{font:400 26px/1.1 "DotGothic16",monospace;color:var(--c);white-space:nowrap}
.ev .gm{align-self:flex-start;font-size:12px;border:2px solid var(--c);border-radius:999px;padding:1px 10px}
.ev .et{font:400 19px/1.25 "DotGothic16",monospace;margin:4px 0 0}
.ev .ex{margin:0;font-size:14px}
.ev .sm{margin:auto 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.ev .sm span{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px;color:var(--ink)}
.ev.next{border-color:var(--c);box-shadow:6px 6px 0 #0006,0 0 24px color-mix(in srgb,var(--c) 50%,transparent)}
@keyframes nxb{50%{opacity:.35}}
.ev .nx{font:12px "DotGothic16",monospace;background:var(--c);color:#0b0814;padding:2px 8px;border-radius:6px;animation:nxb 1s steps(1) infinite}

@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}#welcome .stage{transition:none}}


#about .about{grid-template-columns:minmax(0,1fr)}

@media(max-width:560px){.hud .gn,.hud .best{display:none}.hud{padding:4px 6px 4px 10px;gap:6px}.hud button{min-height:32px;padding:2px 8px}.toast{bottom:64px;font-size:13px}}

/* lite（スマホ）: 重い効果を省いて安定させる */
.lite .rbw,.lite .shine,.lite .gl,.lite .burst{display:none}
.lite .glow{animation:none!important;filter:drop-shadow(0 0 12px rgba(162,75,234,.6))}
.lite .nc{box-shadow:none!important}
.lite .card{animation:none}
.lite .btn{animation:none}
.lite #welcome .tw{filter:none!important}

#welcome .stage.land{width:1920px;height:1080px}
#welcome .stage[hidden]{display:none}

.filter{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#0b0814eb;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;box-shadow:4px 4px 0 #000}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 420px}
.chip{min-height:40px;padding:4px 14px;border-radius:999px;border:2px solid var(--c);background:transparent;color:var(--ink);font:14px "DotGothic16",monospace;cursor:pointer;transition:background .15s,transform .15s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--c) 35%,#0b0814);box-shadow:0 0 14px color-mix(in srgb,var(--c) 50%,transparent)}
.sbox{display:flex;align-items:center;gap:6px;flex:1 1 220px}
.sbox input{flex:1;min-width:0;min-height:42px;font:16px "M PLUS 1p",sans-serif;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:6px 12px}
.sbox input:focus{border-color:var(--cyan);outline:none}
.sbox select{min-height:42px;font:16px "M PLUS 1p",sans-serif;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:6px 10px}
.sbox select:focus{border-color:var(--cyan);outline:none}
.dfilter{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;flex:1 1 100%}
.dfilter .ysel{flex:0 0 auto}
.dfilter .dsel{flex:1 1 320px}
.dfilter .dsel input{min-width:0;flex:1 1 130px;color-scheme:dark}
.dfilter .til{opacity:.7}
.sbox .lb{white-space:nowrap}
.lnk{color:var(--cyan);word-break:break-all}
.yhead{font:22px "DotGothic16",monospace;color:var(--cyan);margin:22px 4px 10px;letter-spacing:.08em;display:flex;align-items:center;gap:12px}
.yhead::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--line),transparent)}
.months>.yhead:first-child{margin-top:0}
.pastmon{margin-top:22px;border:2px dashed var(--line);border-radius:14px;padding:6px 14px 10px;opacity:.85}
.pastmon>summary{cursor:pointer;font:16px "DotGothic16",monospace;color:var(--sub,#b9add0);padding:8px 2px;list-style:none}
.pastmon>summary::before{content:"▶ ";font-size:12px}
.pastmon[open]>summary::before{content:"▼ "}
.invite{margin-top:26px}
.invc{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#0b0814f2,color-mix(in srgb,var(--c) 25%,#0b0814));border:2px dashed var(--c);border-radius:16px;padding:clamp(18px,3vw,28px);box-shadow:6px 6px 0 #000}
.invt{flex:1 1 380px}
.invh{font:400 clamp(20px,3vw,26px)/1.35 "DotGothic16",monospace;margin:0 0 8px}
.invh .gm{font-size:inherit;padding:0 12px;vertical-align:1px}
.invs{margin:0;color:var(--muted);font-size:14px}

.tent{font:12px "DotGothic16",monospace;color:#ffd6f3;border:2px dashed var(--pink);border-radius:6px;padding:0 8px;white-space:nowrap}

a.evr{color:var(--ink);text-decoration:none;cursor:pointer;transition:transform .15s,background .15s}
a.evr:hover{transform:translateX(4px);background:#ffffff0d}
a.evr:hover .go{color:var(--pink)}
.more{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.more .go{font:13px "DotGothic16",monospace;color:var(--cyan)}
.stc{display:inline-block;font:13px "DotGothic16",monospace;color:#0b0814;background:var(--s);border-radius:6px;padding:2px 10px;white-space:nowrap}
.back{display:inline-flex;align-items:center;min-height:44px;padding:6px 14px;margin-bottom:16px;border-radius:8px;border:2px solid var(--line);background:#0b0814eb;color:var(--ink);text-decoration:none;font:14px "DotGothic16",monospace}
.back:hover{border-color:var(--cyan);color:var(--ink)}
.dhead{background:linear-gradient(135deg,#0b0814f2,color-mix(in srgb,var(--c) 22%,#0b0814));border:2px solid var(--c);border-radius:16px;padding:clamp(18px,3vw,30px);box-shadow:6px 6px 0 #000;margin-bottom:20px}
.dtags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dhead h2.dname{background:none;border:0;box-shadow:none;padding:0;margin:10px 0 4px;font-size:clamp(30px,5vw,48px)}
.ddate{font:400 22px "DotGothic16",monospace;color:var(--c);margin:0 0 12px}
.dstat .stc{font-size:16px;padding:4px 14px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
ul.dl{margin:0;padding-left:1.2em;display:grid;gap:6px}
.dnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}
.dnav .tbtn{text-decoration:none;display:inline-flex;align-items:center}

h2{display:flex;width:fit-content;max-width:100%;align-items:center;background:#0b0814eb;border:2px solid var(--line);border-radius:12px;padding:10px 18px;box-shadow:4px 4px 0 #000;margin-bottom:14px}
.sh{width:100%;background:#0b0814eb;border:2px solid var(--line);border-radius:10px;padding:8px 14px;box-shadow:3px 3px 0 #000}
.lead{display:block;width:fit-content;max-width:100%;background:#0b0814d9;border-radius:8px;padding:6px 12px}
.aboutbox{background:#0b0814d9;border:2px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,26px);box-shadow:5px 5px 0 #0008}
ul.news{background:#0b0814d9;border:2px solid var(--line);border-radius:12px;padding:0 14px}
ul.news li:last-child{border-bottom:0}
.evtools{margin:0 0 18px}
.mt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.mtn{font:400 17px "DotGothic16",monospace}
.cnt{font-size:13px;color:var(--ink);background:#ffffff10;border-radius:999px;padding:2px 10px}
.cnt:empty{display:none}
footer span{background:#0b0814d9;padding:2px 8px;border-radius:6px}

.topgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);margin-top:clamp(32px,5vw,56px)}
.topgrid .links{grid-template-columns:minmax(0,1fr)}
.sh{font-size:22px;display:flex;align-items:center;gap:8px}
.sh .ic{display:inline-block;width:.8em;height:.8em;background:var(--c,var(--pink));clip-path:polygon(0 30%,30% 30%,30% 0,70% 0,70% 30%,100% 30%,100% 70%,70% 70%,70% 100%,30% 100%,30% 70%,0 70%);animation:icspin 4s ease-in-out infinite}
.evtools{display:flex;flex-wrap:wrap;gap:8px;margin:-10px 0 18px}
.tbtn{min-height:40px;padding:6px 14px;border-radius:8px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);font:14px "DotGothic16",monospace;cursor:pointer}
.tbtn:hover{border-color:var(--cyan)}
.months{display:grid;gap:12px}
details.mon{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:14px;box-shadow:5px 5px 0 #0006;overflow:hidden}
details.mon.next{border-color:var(--pink);box-shadow:5px 5px 0 #0006,0 0 22px #ff3fd055}
details.mon summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px 14px;padding:14px 18px;flex-wrap:wrap;min-height:56px}
details.mon summary::-webkit-details-marker{display:none}
details.mon summary:hover{background:#ff3fd00d}
.mn{font:400 16px "DotGothic16",monospace;color:var(--muted);white-space:nowrap}.mn b{font:400 30px/1 "DotGothic16",monospace;color:var(--ink);margin-right:2px}
.my{font-size:12px;color:var(--muted)}
.mt{font:400 16px "DotGothic16",monospace;flex:1 1 200px}
.cnt{font-size:12px;color:var(--muted);white-space:nowrap}
.chev{width:12px;height:12px;border-right:3px solid var(--cyan);border-bottom:3px solid var(--cyan);transform:rotate(45deg);transition:transform .25s;margin-left:4px}
details[open] .chev{transform:rotate(225deg)}
.nx{font:12px "DotGothic16",monospace;background:var(--pink);color:#fff;padding:2px 8px;border-radius:6px;animation:nxb 1s steps(1) infinite}
@keyframes nxb{50%{opacity:.35}}
.evs{display:grid;gap:12px;padding:4px 14px 16px}
details[open] .evs{animation:pin .4s ease-out}
.evr{display:grid;grid-template-columns:11em minmax(0,1fr);gap:8px 18px;padding:14px 16px;border-radius:10px;background:#0b081499;border-left:6px solid var(--c)}
.evr.isnext{background:#ff3fd014;outline:2px solid var(--pink)}
.lb{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-right:8px;vertical-align:2px}

<script>
{
/* ---------- Googleシートから読み込み（GitHub Pages 用） ---------- */
const parseCSV = (t) => {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  if (!rows.length) return [];
  const head = rows[0].map((h) => h.trim());
  return rows.slice(1).filter((r) => r.some((v) => v.trim() !== "")).map((r) => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
};
const ymd = (v) => { const m = String(v || "").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m ? `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}` : ""; };
const ym = (v) => { const m = String(v || "").match(/(\d{4})\D+(\d{1,2})/); return m ? `${m[1]}-${m[2].padStart(2, "0")}` : ""; };
const lines = (v) => String(v || "").split(/\n|／/).map((x) => x.trim()).filter(Boolean);
const loadSheet = async () => {

    const r = await fetch(`https://docs.google.com/spreadsheets/d/${S.id}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`, { cache: "no-store" });
    if (!r.ok) throw new Error(name);
    return parseCSV(await r.text());
  };
  const [ev, nw, ar] = await Promise.all([get(S.tabs.events).catch(() => null), get(S.tabs.news).catch(() => null), get(S.tabs.archive).catch(() => null)]);
  if (ev && ev.length) window.SITE.events = ev.map((r) => {
    const d = ymd(r["日付"]);
    return { month: ym(r["月"]) || (d ? d.slice(0, 7) : ""), d, date: r["日時"] || (d ? d.replace(/-/g, "/") : "日程調整中"),
      type: r["種類"] || "メイン", game: r["ゲーム"], name: r["イベント名"] || "イベント名未定", detail: r["詳細"] || "未定",
      confirmed: /^(済|確定|○|◯|TRUE|true|yes|1)$/.test(r["確定"] || ""), status: r["募集状況"] || "調整中", period: r["募集期間"], capacity: r["定員"], conditions: lines(r["応募条件"]), apply: r["参加方法"],
      rules: lines(r["ルール"]), note: r["備考"], links: r["リンクURL"] ? [{ label: r["リンク名"] || "くわしく", url: r["リンクURL"] }] : [] };
  }).filter((e) => e.month);
  if (nw) window.SITE.news = nw.map((r) => ({ date: r["日付"], tag: r["タグ"], title: r["タイトル"], url: r["URL"] })).filter((n) => n.title);
  if (ar) window.SITE.archive = ar.map((r) => ({ name: r["イベント名"], date: r["日付"], game: r["ゲーム"],
    results: lines(r["結果"]).map((x) => { const p = x.split(/[:：]/); return p.length > 1 ? [p[0].trim(), p.slice(1).join(":").trim()] : ["", x]; }),
    note: r["メモ"], url: r["URL"] })).filter((a) => a.name);
  if (S.updatedFromSheet !== false) window.SITE.updated = new Date().toLocaleDateString("ja-JP").replace(/\//g, ".") + "（シート連携）";
};
const run = () => {
const SITE = window.SITE;
const LITE = matchMedia("(pointer: coarse)").matches || innerWidth < 820;
if (LITE) document.documentElement.classList.add("lite");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const btn = (l, cls) => l.url ? `<a class="btn ${cls}"${ext(l.url)}>${esc(l.title)}</a>` : `<a class="btn ${cls}" aria-disabled="true">${esc(l.title)}（準備中）</a>`;

/* ---------- render content ---------- */
$("#aboutText").innerHTML = SITE.about.map((p) => `<p>${esc(p)}</p>`).join("");
$("#tags").innerHTML = SITE.tags.map((t, i) => `<li style="--c:${COLS[i % 4]}">${esc(t)}</li>`).join("");
$("#aboutBtns").innerHTML = btn(L.discord, "") + btn(L.x, "alt");
const GC = { "VALORANT": "var(--pink)", "OW2": "var(--cyan)", "Apex": "var(--mint)", "Minecraft": "#7dff6a" };
const today = new Date();
const EV = SITE.events;
EV.forEach((e, i) => { e.id = e.id || `ev-${e.month}-${i}`; });
const SC = { "募集中": "var(--mint)", "募集前": "var(--cyan)", "締切": "var(--pink)", "開催終了": "#8a7cc0", "調整中": "#8a7cc0" };
const fixed = (e) => e.confirmed === true;
const tentChip = (e) => fixed(e) ? "" : '<span class="tent">確定前</span>';
const stChip = (st) => st ? `<span class="stc" style="--s:${SC[st] || "var(--violet)"}">${esc(st)}</span>` : "";
const nextEv = EV.filter((e) => e.d && new Date(e.d + "T23:59:59") >= today).sort((a, b) => a.d < b.d ? -1 : 1)[0];
const nextMonth = nextEv ? nextEv.month : null;
const GLIST = ["VALORANT", "OW2", "Apex", "Minecraft", "複数タイトル"];
EV.forEach((e) => { if (e.game && !GLIST.includes(e.game)) GLIST.splice(GLIST.length - 1, 0, e.game); });
let fGame = "", fQ = "", fY = "", fD1 = "", fD2 = "";
// 日付がないイベント（日程調整中）は、その月が期間に重なっていれば表示する
const monthEnd = (m) => { const [y, mo] = m.split("-").map(Number); return `${m}-${String(new Date(y, mo, 0).getDate()).padStart(2, "0")}`; };
const inRange = (e) => {
  if (!fD1 && !fD2) return true;
  const from = e.d || `${e.month}-01`, to = e.d || monthEnd(e.month);
  return (!fD1 || to >= fD1) && (!fD2 || from <= fD2);
};
const qText = (e) => [e.name, e.detail, e.game, e.date, e.type, e.d, e.d && e.d.replace(/-0?/g, "/"), e.month, e.month && e.month.replace("-", "年") + "月", e.month && (+e.month.slice(5)) + "月"].join(" ").toLowerCase();
const filtering = () => !!(fGame || fQ || fY || fD1 || fD2);
// 「2月」「2027年2月」は月で探す（「12月」に当たらないように）
const qMonth = (e) => { const m = /^(?:(\d{4})\s*年\s*)?(\d{1,2})\s*月$/.exec(fQ); if (!m) return null; return (!m[1] || e.month.startsWith(m[1])) && +e.month.slice(5) === +m[2]; };
const match = (e) => (!fGame || e.game === fGame) && (!fY || e.month.startsWith(fY)) && inRange(e) && (!fQ || (qMonth(e) ?? qText(e).includes(fQ)));
const renderMonths = () => {
// 日付順（日付のないイベントはその月の最後）
const SHOWN = EV.filter(match).slice().sort((a, b) => a.month !== b.month ? (a.month < b.month ? -1 : 1) : (a.d || "9999") < (b.d || "9999") ? -1 : (a.d || "9999") > (b.d || "9999") ? 1 : 0);
const months = [...new Set(SHOWN.map((e) => e.month))].sort();
const mname = (m) => { const [y, mo] = m.split("-"); return { y, mo: +mo }; };
const thisMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;
const monthHtml = (m) => {
  const list = SHOWN.filter((e) => e.month === m), { y, mo } = mname(m), isNext = m === nextMonth;

  return `<details class="mon${isNext ? " next" : ""}" data-m="${m}"${isNext || filtering() ? " open" : ""}>
    <summary><span class="mn"><b>${mo}</b>月</span><span class="my">${y}</span><span class="mt">${mainEv ? `<span class="mtn">${esc(mainEv.name)}</span>${mainEv.game ? `<span class="gm" style="--c:${GC[mainEv.game] || "var(--violet)"}">${esc(mainEv.game)}</span>` : ""}${tentChip(mainEv)}` : `<span class="mtn">${esc(list[0].name)}</span>`}</span>${isNext ? '<span class="nx">NEXT</span>' : ""}<span class="cnt">${others > 0 ? `ほか${others}件のイベント` : ""}</span><span class="chev" aria-hidden="true"></span></summary>
    <div class="evs">${list.map((e) => `
      <a class="evr${e === nextEv ? " isnext" : ""}" href="#${e.id}" style="--c:${GC[e.game] || "var(--violet)"}">
        <div class="when"><span class="lb">日時</span><span class="dt">${esc(e.date)}</span></div>
        <div class="what">
          <div class="nm"><span class="lb">名前</span><span class="tg ${e.type === "メイン" ? "main" : ""}">${esc(e.type)}</span>${e.game ? `<span class="gm">${esc(e.game)}</span>` : ""}${tentChip(e)}${e === nextEv ? '<span class="nx">NEXT</span>' : ""}<p class="ttl">${esc(e.name)}</p></div>
          <div class="dtl"><span class="lb">詳細</span><p>${lines2br(e.detail)}</p></div>
          ${e.note ? `<div class="rmk"><span class="lb">備考</span><p>${lines2br(e.note)}</p></div>` : ""}
          <div class="more">${stChip(e.status)}<span class="go">詳細を見る ▶</span></div>
        </div>
      </a>`).join("")}</div>
  </details>`;
};
// 年が変わるところに見出しを入れる
const withYears = (ms) => { let last = ""; return ms.map((m) => { const y = m.slice(0, 4), h = y !== last ? `<h3 class="yhead">${y}</h3>` : ""; last = y; return h + monthHtml(m); }).join(""); };
// 絞り込み中は全部を日付順に。ふだんは「これから」を上に、終わった月は下にまとめて畳む
const upcoming = filtering() ? months : months.filter((m) => m >= thisMonth);
const past = filtering() ? [] : months.filter((m) => m < thisMonth).reverse();
$("#months").innerHTML = withYears(upcoming) + (past.length ? `<details class="pastmon"><summary>終わった月（${past.length}）</summary>${withYears(past)}</details>` : "");
if (!SHOWN.length) $("#months").innerHTML = `<div class="empty"><b>NO EVENT</b>${fGame ? esc(fGame) + " のイベントは、まだ予定されていません。" : "条件に合うイベントが見つかりませんでした。"}</div>`;
const g = fGame && fGame !== "複数タイトル" ? fGame : "";
$("#invite").innerHTML = `<div class="invc" style="--c:${GC[g] || "var(--violet)"}">
  <div class="invt"><p class="invh">${g ? `<span class="gm">${esc(g)}</span> のイベントを開催してみませんか？` : "あなたの好きなゲームで、イベントを開催してみませんか？"}</p>
  <p class="invs">PGは、ゲームイベントの企画・運営・参加が気軽にできるコミュニティです。「こんな大会やりたい」「この企画を一緒にやりたい」など、Discordサーバーで気軽に相談してください。</p></div>
  ${L.discord.url ? `<a class="btn"${ext(L.discord.url)}>Discordサーバーで相談する</a>` : ""}</div>`;
};
$("#gchips").innerHTML = ["すべて", ...GLIST].map((g) => `<button type="button" class="chip" data-g="${g === "すべて" ? "" : esc(g)}" style="--c:${GC[g] || (g === "すべて" ? "var(--ink)" : "var(--violet)")}" aria-pressed="${g === "すべて"}">${esc(g)}</button>`).join("");
$("#gchips").addEventListener("click", (ev) => { const b = ev.target.closest(".chip"); if (!b) return; fGame = b.dataset.g; document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c === b)); renderMonths(); });

const years = [...new Set([...EV.map((e) => e.month.slice(0, 4)), String(today.getFullYear())])].filter(Boolean).sort();
$("#fy").innerHTML = `<option value="">すべて</option>` + years.map((y) => `<option value="${y}">${y}年</option>`).join("");
$("#fy").addEventListener("change", (ev) => { fY = ev.target.value; renderMonths(); });
$("#fd1").addEventListener("change", (ev) => { fD1 = ev.target.value; renderMonths(); });

$("#fclear").addEventListener("click", () => {
  fGame = fQ = fY = fD1 = fD2 = "";

      ${e.rules && e.rules.length ? `<div class="card st" style="animation-delay:.18s"><h3>ルール</h3>${list(e.rules)}</div>` : ""}
      ${e.note || (e.links && e.links.length) ? `<div class="card st" style="animation-delay:.22s"><h3>備考</h3>${e.note ? `<p style="margin:0">${rich(e.note)}</p>` : ""}<div class="row">${(e.links || []).filter((l) => l.url).map((l) => `<a class="btn"${ext(l.url)}>${esc(l.label)}</a>`).join("")}</div></div>` : ""}

};
if (nextEv) $("#nextbox").innerHTML = `<span class="badge">NEXT</span><span class="px">${esc(nextEv.date)}　${esc(nextEv.name)}${nextEv.game ? "（" + esc(nextEv.game) + "）" : ""}</span><a href="#${nextEv.id}">くわしく ▶</a>`;

$("#linkList").innerHTML = Object.values(L).map((l, i) => `
  <a class="card lk${l.url ? "" : " off"}" style="--c:${COLS[i % 4]}"${ext(l.url)}>

const tw = ["PLAY GAME", "プレイゲーム"];

      overT += dt;
      ctx.fillStyle = "rgba(11,8,20,.45)"; ctx.fillRect(0, 0, W, H);
      const sz = Math.min(140, W * .2), cy = H * .5;
      ctx.textAlign = "center"; ctx.font = `${sz}px "DotGothic16", monospace`;
      const sh = overT < .4 ? (Math.random() - .5) * 16 : 0;
      ctx.fillStyle = "#16121f"; ctx.fillText("OUT!", W / 2 + 6 + sh, cy + 6);
      ctx.fillStyle = NEONC[((t0 * 8) | 0) % 6]; ctx.fillText("OUT!", W / 2 + sh, cy);
      ctx.font = `22px "DotGothic16", monospace`; ctx.fillStyle = "#fff";
      ctx.fillText(`SCORE ${score}   BEST ${best}`, W / 2, cy + 44);
      ctx.fillStyle = "#c9b6ff"; ctx.fillText(`RETRY ${Math.max(0, Math.ceil(3 - overT))}`, W / 2, cy + 76);
      ctx.textAlign = "start";
      if (overT > 3) startGame(game);
    }
  }
  else if (game && cur === "about") game.draw(.25);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.txt ? 0 : 260) * dt;
    ctx.globalAlpha = Math.min(1, p.life * 2);
    if (p.txt) { ctx.font = '18px "DotGothic16", monospace'; ctx.fillStyle = "#16121f"; ctx.fillText(p.txt, p.x - 18, p.y + 2); ctx.fillStyle = "#fff"; ctx.fillText(p.txt, p.x - 20, p.y); }
    else { ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); }
  }
  ctx.globalAlpha = 1;
  if (comboT > 0) comboT -= dt;
  requestAnimationFrame(loop);
};

/* ---------- welcome ---------- */
let welcomeDone = false;
const WEL = $("#welcome"), stP = $("#stage"), stL = $("#stageL");
let stage = stP;
let curLand = null;
const fit = () => {
  if (!WEL.isConnected) return;
  const land = innerWidth / innerHeight > 1;
  if (land !== curLand) {
    curLand = land;
    (land ? stP : stL).innerHTML = "";
    const tgt = land ? stL : stP;
    tgt.innerHTML = ""; tgt.appendChild($(land ? "#tplL" : "#tplP").content.cloneNode(true));
  }
  stage = land ? stL : stP;
  stL.hidden = !land; stP.hidden = land;
  const w = land ? 1920 : 1080, h = land ? 1080 : 1920;
  const s = Math.min(innerWidth / w, innerHeight / h);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`; stage.dataset.s = s;
};
fit(); addEventListener("resize", fit);
const enter = () => {
  if (welcomeDone) return; welcomeDone = true;
  stage.style.transform = `translate(-50%,-50%) scale(${(+stage.dataset.s || 1) * 1.6})`;
  WEL.classList.add("out"); document.body.classList.remove("locked");
  setTimeout(() => { WEL.remove(); if (on) showToast(game.name + "：" + game.how); }, 650);
};
const first = location.hash.slice(1);
go(valid(first) ? first : "about", false);
if (valid(first)) { WEL.remove(); welcomeDone = true; } else { document.body.classList.add("locked"); WEL.focus(); }
WEL.addEventListener("click", enter);
WEL.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enter(); } });
requestAnimationFrame(loop);
};
loadSheet().catch(() => {}).finally(run);
}
