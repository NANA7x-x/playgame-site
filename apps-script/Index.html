<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--bg:#0b0814;--panel:#16121f;--panel2:#1f1a2c;--line:#3a3050;--ink:#f3eefc;--sub:#b9add0;--pink:#ff3fd0;--cyan:#2fd8ff;--mint:#3dffb0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--sub);margin:0 0 16px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px}
.bar select{flex:1 1 280px}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px;background:var(--panel)}
legend{padding:0 6px;color:var(--cyan);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
label.full{grid-column:1/-1}
.req::after{content:" *";color:var(--pink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--cyan);border-color:transparent}
input[type=date],input[type=time],input[type=month]{color-scheme:dark}
.hint{font-size:12px;color:var(--sub);opacity:.85}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.check input{width:20px;min-height:20px}
.auto{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--sub)}
.auto b{color:var(--mint);font-weight:600}
button{font:inherit;border-radius:10px;padding:10px 18px;min-height:44px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
button.primary{background:var(--pink);border-color:var(--pink);color:#1a0718;font-weight:700}
button.danger{border-color:#ff6b6b;color:#ff9b9b}
button:disabled{opacity:.5;cursor:wait}
.actions{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 8px}
#msg{flex:1 1 240px;font-size:14px}
#msg.ok{color:var(--mint)}#msg.ng{color:#ff9b9b}
.newsck{flex:1 1 100%;justify-content:flex-end;font-size:14px}
.err{flex:1 1 100%;background:#3a1020;border:2px solid #ff6b6b;color:#ffd0d0;border-radius:10px;padding:12px 14px;font-size:15px;white-space:pre-line}
.done{background:var(--panel);border:2px solid var(--mint);border-radius:16px;padding:28px 20px;text-align:center;margin:10px 0 20px}
.done h2{margin:0 0 6px;font-size:24px;color:var(--mint)}
.done .nm{font-size:18px;font-weight:700;margin:6px 0 4px;word-break:break-word}
.done .info{color:var(--sub);font-size:14px;margin:0 0 4px}
.done .btns{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:20px auto 0}
.imgrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.imgprev{display:block;max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line);background:#000;margin-bottom:10px}
.filebtn{display:inline-flex;flex-direction:row;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--cyan);background:var(--panel2);color:var(--cyan);font-size:15px;cursor:pointer}
.filebtn input{display:none}
.done a.btnlink{display:block;text-align:center;text-decoration:none;font:inherit;border-radius:10px;padding:10px 18px;border:1px solid var(--line);background:var(--panel2);color:var(--cyan)}
</style>
</head>
<body>
<main>
  <h1>PG イベント登録</h1>
  <p class="sub">保存すると、スプレッドシートの「イベント」に入ります。HPとDiscordの告知（NANA Support）にもそのまま反映されます。詳細やルールの欄は、そのまま改行できます。</p>

  <div class="done" id="done" hidden>
    <h2>✅ 保存しました！</h2>
    <p class="nm" id="doneName"></p>
    <p class="info" id="doneInfo"></p>
    <p class="info" id="doneNews"></p>
    <p class="info">HPとDiscordの告知に反映されます（HPは開き直すと出ます）。</p>
    <div class="btns">
      <button type="button" class="primary" id="again">＋ 続けて別のイベントを登録する</button>
      <button type="button" id="editMore">このイベントをもう少し直す</button>
      <a class="btnlink" href="https://nana7x-x.github.io/playgame-site/#events" target="_blank" rel="noopener">HPで確認する ↗</a>
    </div>
  </div>

  <div id="editor">
  <div class="bar">
    <select id="pick" aria-label="編集するイベント"><option value="">＋ 新しいイベントを登録する</option></select>
    <button type="button" id="reload">一覧を読み直す</button>
  </div>

  <form id="f" autocomplete="off" novalidate onsubmit="return false">
    <fieldset><legend>基本</legend>
      <div class="grid">
        <label class="full"><span class="req">イベント名</span><input name="イベント名" maxlength="100" placeholder="PROFLUX CUP 01"><span class="hint">「イベント名未定」のあいだは Discord の告知は出ません</span></label>
        <label>種類<select name="種類"><option>メイン</option><option>小規模</option><option>Nexus Server</option></select></label>
        <label>形式<select name="形式"><option>大会</option><option>祭り</option><option>交流会</option></select><span class="hint">HPの「形式」の絞り込みに使います</span></label>
        <label>対象<select name="対象"><option>誰でも</option><option>配信者だけ</option><option>配信者と一般</option></select><span class="hint">HPの「対象」の絞り込みに使います</span></label>
        <label>ゲーム<input name="ゲーム" list="games" placeholder="例：VALORANT、ストリートファイター6"><span class="hint">候補から選ぶか、リストにないゲームはそのまま入力できます</span></label>
        <label class="check"><input type="checkbox" name="確定" value="済">内容が確定した（「確定前」の表示が消えます）</label>
      </div>
    </fieldset>

    <fieldset><legend>日程</legend>
      <div class="grid">
        <label>実施日<input type="date" name="日付"><span class="hint">まだ決まっていなければ空でOK</span></label>
        <label>開始時刻<input type="time" name="開始時刻"><span class="hint">入れると当日の朝と30分前に告知します</span></label>
        <label id="monthBox">実施予定の月（実施日が未定のとき）<input type="month" name="月"><span class="hint">実施日を入れたら不要です</span></label>
        <label>募集開始日<input type="date" id="p1d"><span class="hint">この日の朝9時に「募集開始」を告知します</span></label>
        <label>募集開始の時刻（任意）<input type="time" id="p1t"><span class="hint">入れるとその時刻に告知します</span></label>
        <label>募集締切日<input type="date" id="p2d"><span class="hint">この日の朝9時に「今日が締切」を告知します</span></label>
        <label>締切の時刻（任意）<input type="time" id="p2t"><span class="hint">空ならその日いっぱい</span></label>
        <input type="hidden" name="募集期間"><p class="hint full" id="pOld" hidden></p>
        <label class="full">HPに出す日にちの書き方（ふだんは空でOK）<input name="日時" placeholder="空なら実施日から自動で「2026/11/22（日）」"><span class="hint">「1月中（日程調整中）」のように書きたいときだけ使います</span></label>
      </div>
    </fieldset>

    <fieldset><legend>内容</legend>
      <div class="grid">
        <label class="full">詳細<textarea name="詳細" placeholder="どんなイベントか"></textarea></label>
        <label class="full">ルール<textarea name="ルール" placeholder="1行に1つ書くと、HPで箇条書きになります"></textarea></label>
        <label class="full">備考<textarea name="備考"></textarea></label>
      </div>
    </fieldset>

    <fieldset><legend>募集</legend>
      <div class="grid">
        <label>募集状況<select name="募集状況"><option>調整中</option><option>募集前</option><option>募集中</option><option>締切</option><option>開催終了</option></select></label>
        <label>定員<input name="定員" placeholder="8チーム"></label>
        <label class="full">応募条件<textarea name="応募条件" placeholder="1行に1つ書くと、HPで箇条書きになります"></textarea></label>
        <label class="full">参加方法<textarea name="参加方法" placeholder="Discordのエントリーチャンネルで申請"></textarea></label>
        <div class="auto full" id="auto"></div>
      </div>
    </fieldset>

    <fieldset><legend>画像</legend>
      <img class="imgprev" id="imgPrev" alt="イベント画像のプレビュー" hidden>
      <div class="imgrow">
        <label class="filebtn">🖼 画像を選ぶ<input type="file" id="imgFile" accept="image/*"></label>
        <button type="button" id="imgClear" hidden>画像を外す</button>
      </div>
      <div class="grid" style="margin-top:10px">
        <label class="full">画像のURL（画像を選ぶと自動で入ります）<input name="画像" type="url" placeholder="https://..."><span class="hint">Discordの告知（募集開始・当日の朝）とHPのイベント詳細に出ます。横長（16:9くらい）がきれいに見えます。画像は登録した人のGoogleドライブ「PG イベント画像」に保存されます。</span></label>
      </div>
    </fieldset>

    <fieldset><legend>リンク</legend>
      <div class="grid">
        <label>リンク名<input name="リンク名" placeholder="エントリー"></label>
        <label>リンクURL<input name="リンクURL" type="url" placeholder="https://..."></label>
        <label>配信URL<input name="配信URL" type="url" placeholder="https://youtube.com/..."><span class="hint">当日朝・30分前の告知に載ります</span></label>
        <label>参加サーバー<input name="参加サーバー" type="url" placeholder="https://discord.gg/..."><span class="hint">募集開始・締切・当日朝の告知に載ります</span></label>
      </div>
    </fieldset>

    <div class="actions">
      <label class="check newsck"><input type="checkbox" id="news" checked><span id="newsLabel">HPのお知らせに「情報を公開しました」を載せる</span></label>
      <div id="err" class="err" role="alert" hidden></div>
      <span id="msg" role="status"></span>
      <button type="button" class="danger" id="del" hidden>このイベントを消す</button>
      <button type="button" class="primary" id="save">保存する</button>
    </div>
  </form>
  </div>
  <datalist id="games"><option>VALORANT</option><option>OW2</option><option>Apex</option><option>Minecraft</option><option>複数タイトル</option></datalist>
</main>
<script>
const $ = (s) => document.querySelector(s);
const form = $('#f');
let events = [], current = null;
const run = (fn, ...args) => new Promise((ok, ng) => {
  const slow = setTimeout(() => { $('#msg').textContent = 'Googleからの返事を待っています…（30秒以上かかるときは、ページを開き直してください）'; }, 8000);
  google.script.run.withSuccessHandler((r) => { clearTimeout(slow); ok(r); }).withFailureHandler((e) => { clearTimeout(slow); ng(e); })[fn](...args);
});
const msg = (t, cls, title) => {
  const err = cls === 'ng';
  $('#err').hidden = !err; $('#err').textContent = err ? '⚠ ' + (title || '保存できませんでした') + '\n' + t : '';
  $('#msg').textContent = err ? '' : t; $('#msg').className = err ? '' : (cls || '');
  if (err) $('#err').scrollIntoView({ block: 'center', behavior: 'smooth' });
};
const busy = (on) => { $('#save').disabled = $('#del').disabled = on; };

/* シートの表示（2027/01/23 や 2027-01-23、20:00:00）を入力欄の形にそろえる */
const toDate = (v) => { const m = /(\d{4})\D(\d{1,2})\D(\d{1,2})/.exec(v || ''); return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : ''; };
const toMonth = (v) => { const m = /(\d{4})\D(\d{1,2})/.exec(v || ''); return m ? `${m[1]}-${m[2].padStart(2, '0')}` : ''; };
const toTime = (v) => { const m = /(\d{1,2}):(\d{2})/.exec(v || ''); return m ? `${m[1].padStart(2, '0')}:${m[2]}` : ''; };

function fill(e) {
  current = e;
  form.reset();
  if (e) for (const el of form.elements) {
    if (!el.name) continue;
    const v = e[el.name] || '';
    if (el.type === 'checkbox') el.checked = /^(済|確定|○|◯|TRUE|true|yes|1)$/.test(v);
    else if (el.name === '日付') el.value = toDate(v);
    else if (el.name === '月') el.value = toMonth(v);
    else if (el.name === '開始時刻') el.value = toTime(v);
    else if (el.tagName === 'SELECT') { if (![...el.options].some((o) => o.value === v) && v) el.add(new Option(v)); el.value = v || el.options[0].value; }
    else el.value = v;
  }
  $('#del').hidden = !e;
  $('#news').checked = !e;
  $('#newsLabel').textContent = e ? 'HPのお知らせに「情報を更新しました」を載せる' : 'HPのお知らせに「情報を公開しました」を載せる';
  periodToInputs(form.elements['募集期間'].value);
  syncMonth();
  showImg();
  $('#save').textContent = e ? '変更を保存する' : '登録する';
  showAuto(e);
}
/* 募集期間はシートに「2026/11/04-2026/12/05」（時刻つきなら「2026/11/04 12:00-2026/12/05 23:59」）の形で入れる */
const PERIOD = /(\d{4})\D(\d{1,2})\D(\d{1,2})(?:\s*(\d{1,2}:\d{2}))?\s*[-〜～~－]\s*(\d{4})\D(\d{1,2})\D(\d{1,2})(?:\s*(\d{1,2}:\d{2}))?/;
const ymd = (y, m, d) => `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
function periodToInputs(v) {
  const m = PERIOD.exec(v || '');
  $('#p1d').value = m ? ymd(m[1], m[2], m[3]) : ''; $('#p1t').value = m && m[4] ? toTime(m[4]) : '';
  $('#p2d').value = m ? ymd(m[5], m[6], m[7]) : ''; $('#p2t').value = m && m[8] ? toTime(m[8]) : '';
  $('#pOld').hidden = !(v && !m);
  $('#pOld').textContent = v && !m ? `前の書き方の募集期間：「${v}」→ 上の日付で選び直してください` : '';
}
function inputsToPeriod() {
  const d1 = $('#p1d').value, d2 = $('#p2d').value, t1 = $('#p1t').value, t2 = $('#p2t').value;
  if (!d1 && !d2) return $('#pOld').hidden ? '' : form.elements['募集期間'].value;
  if (!d1 || !d2) throw new Error('募集期間は「募集開始日」と「募集締切日」の両方を入れてください（募集しないなら両方とも空に）');
  if (d1 + (t1 || '') > d2 + (t2 || '99')) throw new Error('募集締切日が募集開始日より前になっています');
  const sl = (d) => d.replace(/-/g, '/');
  return `${sl(d1)}${t1 ? ' ' + t1 : ''}-${sl(d2)}${t2 ? ' ' + t2 : ''}`;
}
function showAuto(e) {
  $('#auto').innerHTML = e && (e['募集開始'] || e['募集締切'])
    ? `募集開始（自動）<b>${e['募集開始'] || '—'}</b>　募集締切（自動）<b>${e['募集締切'] || '—'}</b>`
    : '保存すると、募集開始日・募集締切日がシートに入り、その日に告知されます。';
}
function label(e) { return `${e['日付'] || e['日時'] || e['月'] || ''}　${e['イベント名'] || '（名前なし）'}`; }
async function load(selectRow) {
  msg('読み込み中…');
  try {
    events = await run('listEvents');
    const pick = $('#pick');
    pick.length = 1;
    for (const e of events) pick.add(new Option(label(e), e.row));
    pick.value = selectRow ? String(selectRow) : '';
    const games = new Set(['VALORANT', 'OW2', 'Apex', 'Minecraft', '複数タイトル']);
    for (const e of events) if (e['ゲーム']) games.add(e['ゲーム']);
    $('#games').innerHTML = '';
    for (const g of games) $('#games').append(new Option(g));
    fill(events.find((e) => e.row === +pick.value) || null);
    msg('');
  } catch (err) { msg(err.message, 'ng'); }
}
$('#pick').addEventListener('change', (ev) => { fill(events.find((e) => e.row === +ev.target.value) || null); msg(''); });
$('#reload').addEventListener('click', () => load(current && current.row));
const syncMonth = () => { const d = form.elements['日付'].value; if (d) form.elements['月'].value = d.slice(0, 7); $('#monthBox').hidden = !!d; };
form.elements['日付'].addEventListener('change', syncMonth);
form.elements['日付'].addEventListener('input', syncMonth);

/* Enter キーなどでページが読み込み直されないよう、フォームの送信は使わずボタンで保存する */
form.addEventListener('submit', (ev) => { ev.preventDefault(); save(); });
$('#save').addEventListener('click', save);
let saving = false;
function showDone(e) {
  $('#doneName').textContent = e ? e['イベント名'] : '';
  const parts = [];
  if (e && (e['日時'] || e['日付'])) parts.push('日時：' + (e['日時'] || e['日付']) + (e['開始時刻'] ? ' ' + e['開始時刻'] + '〜' : ''));
  if (e && (e['募集開始'] || e['募集締切'])) parts.push('募集開始：' + (e['募集開始'] || '—') + '　募集締切：' + (e['募集締切'] || '—'));
  $('#doneInfo').textContent = parts.join('\n');
  $('#doneInfo').style.whiteSpace = 'pre-line';
  $('#editor').hidden = true; $('#done').hidden = false;
  window.scrollTo(0, 0);
}
function showEditor() { $('#done').hidden = true; $('#editor').hidden = false; window.scrollTo(0, 0); }
$('#again').addEventListener('click', () => { $('#pick').value = ''; fill(null); msg(''); showEditor(); });
$('#editMore').addEventListener('click', () => { msg(''); showEditor(); });
async function save() {
  if (saving) return;
  try { form.elements['募集期間'].value = inputsToPeriod(); } catch (err) { msg(err.message, 'ng'); return; }
  const data = {};
  for (const el of form.elements) if (el.name) data[el.name] = el.type === 'checkbox' ? (el.checked ? '済' : '') : el.value;
  if (!data['イベント名'].trim()) { msg('イベント名を入れてください', 'ng'); return; }
  if (!data['日付'] && !data['月']) { msg('実施日（未定なら実施予定の月）を入れてください', 'ng'); return; }
  for (const k of ['リンクURL', '配信URL', '参加サーバー', '画像']) if (data[k] && !/^https?:\x2f\x2f/.test(data[k])) { msg(`${k} は https: で始まるURLを書いてください`, 'ng'); return; }
  /* 「日付」と「日時」の日にちが食い違っていたら止める（年の選び間違いを防ぐ） */
  const shown = /(\d{4})\D(\d{1,2})\D(\d{1,2})/.exec(data['日時'] || '');
  if (data['日付'] && shown && toDate(shown[0]) !== data['日付']) {
    msg(`「実施日」(${data['日付'].replace(/-/g, '/')}) と「HPに出す日にちの書き方」(${shown[0]}) の日にちが違います。どちらかを直すか、「HPに出す日にちの書き方」を空にしてください（実施日から自動で入ります）。`, 'ng'); return;
  }
  data.__news = $('#news').checked ? (current ? 'update' : 'new') : '';
  saving = true; busy(true); msg('保存中…');
  try {
    const res = await run('saveEvent', data, current ? current.row : 0);
    await load(res.row);
    msg('');
    showDone(res.saved || current);
    $('#doneNews').textContent = res.news ? '📰 HPのお知らせにも載せました：' + res.news : '';
  } catch (err) { msg((err && err.message) || String(err), 'ng'); console.error(err); }
  saving = false; busy(false);
}
$('#del').addEventListener('click', async () => {
  if (!current || !confirm(`「${current['イベント名']}」を消しますか？（HPと告知からも消えます）`)) return;
  busy(true); msg('消しています…');
  try { await run('deleteEvent', current.row); await load(); msg('消しました。', 'ok'); }
  catch (err) { msg(err.message, 'ng'); }
  busy(false);
});
/* 画像：選んだら横幅1600pxまでに縮めてGoogleドライブに保存し、URLを入れる */
const imgInput = form.elements['画像'];
function showImg() {
  const u = imgInput.value.trim();
  $('#imgPrev').hidden = !u; $('#imgClear').hidden = !u;
  if (u) $('#imgPrev').src = u; else $('#imgPrev').removeAttribute('src');
}
imgInput.addEventListener('change', showImg);
$('#imgPrev').addEventListener('error', () => { $('#imgPrev').hidden = true; });
$('#imgClear').addEventListener('click', () => { imgInput.value = ''; showImg(); });
const shrink = (file) => new Promise((ok, ng) => {
  const img = new Image(), src = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    const g = c.getContext('2d'); g.fillStyle = '#0b0814'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(src); ok(c.toDataURL('image/jpeg', 0.88));
  };
  img.onerror = () => { URL.revokeObjectURL(src); ng(new Error('この画像は読み込めませんでした。JPEG か PNG を選んでください。')); };
  img.src = src;
});
$('#imgFile').addEventListener('change', async (ev) => {
  const file = ev.target.files[0]; ev.target.value = '';
  if (!file) return;
  busy(true); msg('画像を縮めています…');
  try {
    const data = await shrink(file);
    msg('画像をアップロード中…');
    imgInput.value = await run('uploadImage', data);
    showImg();
    msg('画像を入れました。「' + $('#save').textContent + '」を押すと反映されます。', 'ok');
  } catch (err) { msg((err && err.message) || String(err), 'ng', '画像を入れられませんでした'); }
  busy(false);
});
load();
</script>
</body>
